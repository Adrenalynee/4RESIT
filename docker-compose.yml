services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: supmeal
      POSTGRES_USER: supmeal_user
      POSTGRES_PASSWORD: supmeal_pass
    volumes:
        - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  server:
    build: ./server
    container_name: server
    environment:
     DATABASE_URL: postgres://supmeal_user:supmeal_pass@db:5432/supmeal
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
    depends_on:
      - db

  client:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "rm -rf node_modules package-lock.json && npm i --include=optional && npm run build"
    container_name: client
    volumes:
      - ./client:/app
    depends_on:
      - server

  webserver:
    image: nginx:1.29.0-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./client/dist:/var/supmeal
      - ./nginx/conf/:/etc/nginx/conf.d/
      - ./nginx/private.key:/ssl/private.key
      - ./nginx/certificate.crt:/ssl/certificate.crt
    depends_on:
      - server
      - client

volumes:
    db_data:
        driver: local